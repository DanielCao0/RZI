name: setup-sdk
description: >-
  Install the Zephyr SDK ARM toolchain (cached) and point
  ZEPHYR_SDK_INSTALL_DIR at it.
inputs:
  version:
    description: Zephyr SDK release, matching the Zephyr revision in rzi/west.yml
    required: true
runs:
  using: composite
  steps:
    - name: Cache the Zephyr SDK
      id: sdk
      uses: actions/cache@v5
      with:
        path: zephyr-sdk-${{ inputs.version }}
        key: zephyr-sdk-${{ inputs.version }}-arm-zephyr-eabi

    - name: Install the Zephyr SDK
      if: steps.sdk.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -eux
        wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${{ inputs.version }}/zephyr-sdk-${{ inputs.version }}_linux-x86_64_minimal.tar.xz"
        tar -xf "zephyr-sdk-${{ inputs.version }}_linux-x86_64_minimal.tar.xz"
        "./zephyr-sdk-${{ inputs.version }}/setup.sh" -t arm-zephyr-eabi -c

    - name: Select the Zephyr SDK
      shell: bash
      run: |
        echo "ZEPHYR_SDK_INSTALL_DIR=${GITHUB_WORKSPACE}/zephyr-sdk-${{ inputs.version }}" \
          >> "${GITHUB_ENV}"
