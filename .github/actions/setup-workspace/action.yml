# SPDX-License-Identifier: Apache-2.0
name: setup-workspace
description: >-
  Create a west workspace around the checked-out RZI module: fetch the pinned
  Zephyr and USP revisions, apply the RZI backend patches, and mount RZI as an
  extra Zephyr module.
inputs:
  zephyr-revision:
    description: Zephyr revision the CI manifest pins
    required: true
runs:
  using: composite
  steps:
    - name: Install west
      shell: bash
      run: python3 -m pip install --upgrade west

    - name: Cache the west workspace
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/workspace/zephyr
          ${{ github.workspace }}/workspace/modules
          ${{ github.workspace }}/workspace/bootloader
          ${{ github.workspace }}/workspace/tools
          ${{ github.workspace }}/workspace/usp_zephyr
        key: west-${{ inputs.zephyr-revision }}-${{ hashFiles('rzi/west.yml') }}
        restore-keys: west-${{ inputs.zephyr-revision }}-

    - name: Generate the CI manifest
      shell: bash
      env:
        ZEPHYR_REVISION: ${{ inputs.zephyr-revision }}
      run: |
        set -eux
        mkdir -p "${GITHUB_WORKSPACE}/workspace"
        python3 - <<'PY'
        import os
        import pathlib

        import yaml

        root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
        deps = yaml.safe_load((root / "rzi/west.yml").read_text())["manifest"]["projects"]
        projects = [
            {
                "name": "zephyr",
                "url": "https://github.com/zephyrproject-rtos/zephyr",
                "revision": os.environ["ZEPHYR_REVISION"],
                "clone-depth": 1,
                "import": True,
            },
        ]
        for dep in deps:
            dep = dict(dep)
            dep["clone-depth"] = 1
            projects.append(dep)
        manifest = {"manifest": {"version": "0.13", "projects": projects}}
        (root / "workspace/west.yml").write_text(yaml.safe_dump(manifest, sort_keys=False))
        PY
        cat "${GITHUB_WORKSPACE}/workspace/west.yml"

    - name: Fetch the pinned dependencies
      shell: bash
      run: |
        set -eux
        cd "${GITHUB_WORKSPACE}/workspace"
        git init -q .
        git add west.yml
        git -c user.name=rzi-ci -c user.email=ci@localhost commit -qm "CI manifest"
        west init -l .
        west update --narrow

    - name: Apply the RZI backend patches
      shell: bash
      working-directory: workspace/usp_zephyr
      run: |
        set -eux
        for patch in "${GITHUB_WORKSPACE}"/rzi/zephyr/patches/usp_zephyr/*.patch; do
          if git apply --reverse --check "${patch}" 2>/dev/null; then
            echo "already applied: $(basename "${patch}")"
          else
            git apply -v "${patch}"
          fi
        done

    - name: Mount RZI as an extra module
      shell: bash
      run: echo "ZEPHYR_EXTRA_MODULES=${GITHUB_WORKSPACE}/rzi" >> "${GITHUB_ENV}"
