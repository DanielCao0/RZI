#
# RZI continuous integration, aligned with Zephyr's compliance workflow
# and the example-application twister gate: check_compliance.py, DCO on
# pull requests, twister --integration, plus REUSE, public-header, Doxygen,
# and SPDX 3 / CycloneDX SBOM checks. Releases: release.yml.
#
# Version pins and local reproduction steps are documented in doc/ci.md.

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Zephyr and USP revisions come from west.yml. The SDK must match
  # that Zephyr revision.
  ZEPHYR_SDK_VERSION: "1.0.1"
  CLANG_FORMAT_VERSION: "23.1.0"
  DOXYGEN_VERSION: "1.13.2"

jobs:
  compliance:
    name: Compliance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out RZI
        uses: actions/checkout@v5
        with:
          path: rzi
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up the west workspace
        uses: ./rzi/.github/actions/setup-workspace

      - name: Fetch the pull request base
        if: github.event_name == 'pull_request'
        run: git -C rzi fetch origin "${{ github.base_ref }}"

      - name: Reject merge commits and rebase onto the target branch
        if: github.event_name == 'pull_request'
        working-directory: rzi
        run: |
          git config user.email "ci@localhost"
          git config user.name "rzi-ci"
          if [[ "$(git rev-list --merges --count "origin/${{ github.base_ref }}..")" != "0" ]]; then
            echo "::error::Merge commits are not allowed; rebase onto the target branch"
            exit 1
          fi
          git rebase "origin/${{ github.base_ref }}"

      - name: Install Zephyr compliance requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1
          python3 -m pip install \
            -r zephyr/scripts/requirements-actions.txt \
            --require-hashes

      - name: Install clang-format
        run: python3 -m pip install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: zephyr/scripts/ci/package-lock.json

      - name: Install the devicetree linter
        run: npm --prefix zephyr/scripts/ci ci

      - name: Coding style
        working-directory: rzi
        run: scripts/check-style.sh --no-checkpatch

      - name: Zephyr compliance
        working-directory: rzi
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        run: |
          before="${{ github.event.before }}"
          empty="0000000000000000000000000000000000000000"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            scripts/check-compliance.sh "origin/${{ github.base_ref }}..HEAD"
          elif [[ "${before}" =~ ^[0-9a-f]{40}$ && "${before}" != "${empty}" ]]; then
            scripts/check-compliance.sh "${before}..${{ github.sha }}"
          else
            scripts/check-compliance.sh "HEAD~1..HEAD"
          fi

      - name: Public ABI must not leak backend symbols
        run: |
          if grep -rnE '\b(smtc_[a-z]|LoRaMac|LmHandler|Mcps|Mlme|ral_[a-z]|sx126|sx127|lr11)' \
              rzi/include/rzi/; then
            echo "::error::private backend symbols leaked into include/rzi/"
            exit 1
          fi

      - name: Source must be ASCII
        run: |
          if LC_ALL=C grep -rnP '[^\x00-\x7F]' rzi/src rzi/include; then
            echo "::error::non-ASCII text in source"
            exit 1
          fi

      - name: REUSE (license and copyright on every file)
        # Run inside the repository. `reuse --root rzi` from the workspace
        # parent treats rzi as a subdirectory of a non-repository and skips
        # Git ignore, so the ruff cache written by compliance fails the lint.
        working-directory: rzi
        run: reuse lint

      - name: Version strings stay in sync
        run: |
          version="$(grep -oP 'RZI_VERSION_STRING "\K[^"]+' rzi/include/rzi/version.h)"
          grep -q "PROJECT_NUMBER         = ${version}" rzi/doc/Doxyfile
          grep -q "cpe:2.3:a:rakwireless:rzi:${version}:" rzi/zephyr/module.yml
          grep -q "pkg:github/DanielCao0/RZI@v${version}$" rzi/zephyr/module.yml

  twister:
    name: Twister (native_sim)
    runs-on: ubuntu-24.04
    env:
      # native_sim builds use the host compiler; declaring the host toolchain
      # skips the Zephyr SDK lookup this job does not need.
      ZEPHYR_TOOLCHAIN_VARIANT: host
    steps:
      - name: Check out RZI
        uses: actions/checkout@v5
        with:
          path: rzi
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up the west workspace
        uses: ./rzi/.github/actions/setup-workspace

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            device-tree-compiler gperf gcc-multilib g++-multilib

      - name: Install the Zephyr Python requirements
        run: |
          python3 -m pip install \
            -r zephyr/scripts/requirements-base.txt \
            -r zephyr/scripts/requirements-build-test.txt \
            -r zephyr/scripts/requirements-run-test.txt

      - name: Run the test suites
        run: |
          set -o pipefail
          if ! west twister -T "${GITHUB_WORKSPACE}/rzi/tests" --inline-logs -v --integration -j "$(nproc)" 2>&1 | tee twister-console.log; then
            grep -aE "ERROR|error:|FAILED" twister-console.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Upload the twister report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: twister-report
          path: twister-out/
          if-no-files-found: ignore

  samples:
    name: Samples (product boards)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out RZI
        uses: actions/checkout@v5
        with:
          path: rzi
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up the west workspace
        uses: ./rzi/.github/actions/setup-workspace

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler gperf

      - name: Install the Zephyr Python requirements
        run: |
          python3 -m pip install \
            -r zephyr/scripts/requirements-base.txt \
            -r zephyr/scripts/requirements-build-test.txt \
            -r zephyr/scripts/requirements-run-test.txt \
            imgtool

      - name: Set up the Zephyr SDK
        uses: ./rzi/.github/actions/setup-sdk
        with:
          version: ${{ env.ZEPHYR_SDK_VERSION }}

      - name: Build the samples
        run: west twister -T "${GITHUB_WORKSPACE}/rzi/samples" --inline-logs -v --integration -j "$(nproc)"

      - name: Upload the twister report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: twister-samples-report
          path: twister-out/
          if-no-files-found: ignore

      - name: Build a reference image with build metadata
        run: |
          west build -b rak4631/nrf52840/rzi --sysbuild rzi/samples/at -d build-sbom \
            -- -DCONFIG_BUILD_OUTPUT_META=y -Dmcuboot_CONFIG_BUILD_OUTPUT_META=y

      - name: Firmware SBOM (SPDX 3)
        run: |
          python3 rzi/scripts/generate-firmware-sbom.py build-sbom
          for image in build-sbom/spdx/*/; do
            args=()
            for doc in "${image}"*.jsonld; do args+=(-j "${doc}"); done
            spdx3-validate -q "${args[@]}"
            python3 rzi/scripts/check-sbom.py --strict "${image}"*.jsonld
          done

      - name: Upload the firmware SBOM
        uses: actions/upload-artifact@v6
        with:
          name: firmware-sbom-at-rak4631_nrf52840_rzi
          path: build-sbom/spdx/

  headers:
    name: Public headers (C and C++)
    runs-on: ubuntu-24.04
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host
    steps:
      - name: Check out RZI
        uses: actions/checkout@v5
        with:
          path: rzi
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up the west workspace
        uses: ./rzi/.github/actions/setup-workspace

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler gperf

      - name: Install the Zephyr Python requirements
        run: |
          python3 -m pip install \
            -r zephyr/scripts/requirements-base.txt \
            -r zephyr/scripts/requirements-build-test.txt \
            -r zephyr/scripts/requirements-run-test.txt

      - name: Configure a reference build
        run: |
          set -o pipefail
          if ! west build -b native_sim/native/64 \
              "${GITHUB_WORKSPACE}/rzi/tests/lorawan/service" \
              -d build-headers --pristine=always 2>&1 | tee build-headers.log; then
            tail -30 build-headers.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Compile every public header as C and C++
        run: python3 rzi/scripts/check-public-headers.py build-headers

  doc:
    name: Documentation (Doxygen)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out RZI
        uses: actions/checkout@v5
        with:
          path: rzi

      - name: Cache doxygen
        id: doxygen
        uses: actions/cache@v5
        with:
          path: doxygen-${{ env.DOXYGEN_VERSION }}
          key: doxygen-${{ env.DOXYGEN_VERSION }}-linux-x86_64

      - name: Install doxygen
        if: steps.doxygen.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/doxygen/doxygen/releases/download/Release_$(echo "${DOXYGEN_VERSION}" | tr . _)/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          mkdir -p "doxygen-${DOXYGEN_VERSION}"
          tar -xf "doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" -C "doxygen-${DOXYGEN_VERSION}"

      - name: Locate the doxygen binary
        run: |
          binary="$(find "doxygen-${DOXYGEN_VERSION}" -type f -name doxygen | head -1)"
          if [[ -z "${binary}" ]]; then
            echo "::error::doxygen binary not found after extraction"
            find "doxygen-${DOXYGEN_VERSION}" | head -20
            exit 1
          fi
          echo "DOXYGEN_BINDIR=${GITHUB_WORKSPACE}/$(dirname "${binary}")" >> "${GITHUB_ENV}"
          "${binary}" --version

      - name: Build the documentation
        working-directory: rzi
        run: |
          export PATH="${DOXYGEN_BINDIR}:${PATH}"
          scripts/generate-doxygen.sh
          if [[ -s doc/doxygen/warnings.log ]]; then
            while IFS= read -r line; do
              echo "::error::${line}"
            done < doc/doxygen/warnings.log
            exit 1
          fi

  sbom:
    name: SBOM
    runs-on: ubuntu-24.04
    steps:
      - name: Check out RZI
        uses: actions/checkout@v5
        with:
          path: rzi
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the SBOM tools
        run: |
          python3 -m pip install pyyaml reuse spdx3-validate \
            "cyclonedx-python-lib[json-validation]"

      - name: Generate the module SBOM
        working-directory: rzi
        run: scripts/generate-sbom.sh

      - name: Validate SPDX 3, CycloneDX 1.6, and the minimum elements
        working-directory: rzi
        run: |
          spdx3-validate -q -j build/sbom/rzi.spdx.jsonld
          python3 scripts/check-sbom.py --strict build/sbom/rzi.spdx.jsonld build/sbom/rzi.cdx.json

      - name: Upload the module SBOM
        uses: actions/upload-artifact@v6
        with:
          name: module-sbom
          path: rzi/build/sbom/
