# SPDX-License-Identifier: Apache-2.0

sample:
  name: RZI LoRa spectral scan
  description: >
    Sweep a frequency range and report the channel RSSI through the RZI raw
    LoRa test API
tests:
  sample.rzi.lora.spectral_scan:
    sysbuild: true
    build_only: true
    tags:
      - rzi
      - lora
    platform_allow:
      - rzi_rak4631/nrf52840
      - rzi_rak3372/stm32wle5xx
    integration_platforms:
      - rzi_rak4631/nrf52840
      - rzi_rak3372/stm32wle5xx
