sample:
  name: RZI LoRa spectral scan
  description: >
    Sweep a frequency range and report the channel RSSI through the RZI raw
    LoRa test API
tests:
  sample.rzi.lora.spectral_scan:
    sysbuild: true
    build_only: true
    tags:
      - rzi
      - lora
    platform_allow:
      - rak4631/nrf52840/rzi
      - rak3172/stm32wle5xx/rzi
      - rak3362/nrf54l15/cpuapp
    integration_platforms:
      - rak4631/nrf52840/rzi
      - rak3172/stm32wle5xx/rzi
      - rak3362/nrf54l15/cpuapp
