# SPDX-License-Identifier: Apache-2.0

sample:
  name: RZI LoRa RF certification
  description: >
    Step through the ETSI, FCC or ARIB LoRa and FSK transmit configurations
    used for radio certification, through the RZI raw LoRa API
common:
  sysbuild: true
  build_only: true
  tags:
    - rzi
    - lora
  platform_allow:
    - rzi_rak4631/nrf52840
    - rzi_rak3372/stm32wle5xx
  integration_platforms:
    - rzi_rak4631/nrf52840
    - rzi_rak3372/stm32wle5xx
tests:
  sample.rzi.lora.rf_certification.etsi:
    extra_configs:
      - CONFIG_APP_RF_CERT_REGION_ETSI=y
  sample.rzi.lora.rf_certification.fcc:
    extra_configs:
      - CONFIG_APP_RF_CERT_REGION_FCC=y
  sample.rzi.lora.rf_certification.arib:
    extra_configs:
      - CONFIG_APP_RF_CERT_REGION_ARIB=y
