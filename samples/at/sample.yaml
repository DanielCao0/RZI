sample:
  name: RZI AT
  description: >
    RAK RUI3-compatible AT command interface over USB CDC UART, with the
    LoRaWAN, P2P and radio-test command packages
tests:
  sample.rzi.at:
    sysbuild: true
    build_only: true
    tags:
      - rzi
      - lorawan
      - lora
      - at
    platform_allow:
      - rak4631/nrf52840/rzi
      - rak3172/stm32wle5xx/rzi
      - rak3372_f/stm32wle5xx
      - rak3362/nrf54l15/cpuapp
    integration_platforms:
      - rak4631/nrf52840/rzi
      - rak3172/stm32wle5xx/rzi
      - rak3372_f/stm32wle5xx
      - rak3362/nrf54l15/cpuapp
