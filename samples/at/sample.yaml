sample:
  name: RZI AT
  description: >
    RAK RUI3-compatible AT command interface over USB CDC UART, with the
    LoRaWAN, P2P and radio-test command packages
tests:
  sample.rzi.at:
    sysbuild: true
    build_only: true
    tags:
      - rzi
      - lorawan
      - lora
      - at
    platform_allow:
      - rzi_rak4631/nrf52840
      - rzi_rak3372/stm32wle5xx
      - rzi_rak3362/nrf54l15/cpuapp
    integration_platforms:
      - rzi_rak4631/nrf52840
      - rzi_rak3372/stm32wle5xx
      - rzi_rak3362/nrf54l15/cpuapp
