sample:
  name: RZI LoRaWAN periodical uplink
  description: >
    Join a LoRaWAN network and send periodic uplinks through the RZI C API
tests:
  sample.rzi.lorawan.periodical_uplink:
    sysbuild: true
    build_only: true
    tags:
      - rzi
      - lorawan
    platform_allow:
      - rak4631/nrf52840/rzi
      - rak3362/nrf54l15/cpuapp
      - rak3172/stm32wle5xx/rzi
      - rak3372_f/stm32wle5xx
    integration_platforms:
      - rak4631/nrf52840/rzi
      - rak3362/nrf54l15/cpuapp
      - rak3172/stm32wle5xx/rzi
      - rak3372_f/stm32wle5xx
  sample.rzi.lorawan.periodical_uplink.lowpower:
    sysbuild: true
    build_only: true
    extra_args:
      - EXTRA_CONF_FILE=prj_lowpower.conf
    tags:
      - rzi
      - lorawan
    platform_allow:
      - rak4631/nrf52840/rzi
      - rak3362/nrf54l15/cpuapp
      - rak3172/stm32wle5xx/rzi
      - rak3372_f/stm32wle5xx
    integration_platforms:
      - rak4631/nrf52840/rzi
      - rak3362/nrf54l15/cpuapp
      - rak3172/stm32wle5xx/rzi
      - rak3372_f/stm32wle5xx
