#
# Low-power variant, merged on top of prj.conf:
#   west build ... -- -DEXTRA_CONF_FILE=prj_lowpower.conf
#
# The console UART keeps its clocks running while enabled, so logging,
# printk, and the UART driver are all removed. The application behaves the
# same, but prints nothing.

CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
