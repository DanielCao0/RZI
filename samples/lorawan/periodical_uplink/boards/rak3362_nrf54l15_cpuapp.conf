# nRF54L15 uses System ON idle. Release the UART and radio SPI bus when idle.
CONFIG_PM_DEVICE_RUNTIME=y
# The radio IRQ handler must be able to wait for the SPI bus to resume.
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_GLOBAL_THREAD=y
