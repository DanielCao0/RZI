#
# USB is disabled in the board overlay. Do not start the device stack;
# that enables USBD and holds the 32 MHz crystal.

CONFIG_LOG=n
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=0

# Radio IRQ is deferred to the system workqueue so SPI runtime PM can
# resume the bus. The legacy in-ISR path cannot wait for that resume.
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_GLOBAL_THREAD=y
CONFIG_PM_DEVICE_RUNTIME=y
# Join plus NewChannelReq/LinkADRReq retries enqueue many TX_DONE and
# downlink events. The default of 8 drops TX_DONE and the app waits forever.
CONFIG_RZI_LORAWAN_EVENT_QUEUE_SIZE=32
