sample:
  name: RZI LoRaWAN FUOTA
  description: >
    Join a LoRaWAN network and accept ChirpStack FUOTA deployments through RZI
tests:
  sample.rzi.lorawan.fuota:
    sysbuild: true
    build_only: true
    tags:
      - rzi
      - lorawan
      - fuota
    platform_allow:
      - rak4631/nrf52840/rzi
      - rak3372_f/stm32wle5xx
    integration_platforms:
      - rak4631/nrf52840/rzi
      - rak3372_f/stm32wle5xx
