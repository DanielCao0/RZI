tests:
  rzi.at.commands.lorawan:
    tags:
      - rzi
      - at
      - lorawan
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  rzi.at.commands.lorawan.storage:
    tags: [rzi, at, lorawan, storage]
    platform_allow: [native_sim]
    integration_platforms: [native_sim]
    extra_configs:
      - CONFIG_RZI_STORAGE=y
      - CONFIG_FLASH_MAP=y
      - CONFIG_NVS=y
      - CONFIG_SETTINGS_NVS=y
      - CONFIG_MAIN_STACK_SIZE=4096
  rzi.at.commands.lorawan.at_nvm:
    tags: [rzi, at, lorawan, storage]
    platform_allow: [native_sim]
    integration_platforms: [native_sim]
    extra_configs:
      - CONFIG_RZI_AT_NVM=y
      - CONFIG_SETTINGS_NVS=y
      - CONFIG_MAIN_STACK_SIZE=4096
