tests:
  rzi.lorawan.service:
    tags:
      - rzi
      - lorawan
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  rzi.lorawan.service.all_scaffolds:
    tags:
      - rzi
      - lorawan
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_RZI_LORAWAN_FUOTA=y
  rzi.lorawan.service.power:
    tags:
      - rzi
      - lorawan
      - power
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_RZI_POWER=y
