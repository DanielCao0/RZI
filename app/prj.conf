# Own USP + LBM LoRaWAN app (not Zephyr CONFIG_LORAWAN / loramac-node).

# --- 板级外设 ---
CONFIG_GPIO=y                          # LED、SX1262 DIO / reset / busy
CONFIG_SPI=y                           # 和 SX1262 通信
CONFIG_SERIAL=y                        # UART 子系统（本板实际走 USB CDC）

# --- 控制台（overlay: zephyr,console = cdc_acm_uart0） ---
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y                  # printk / LOG 走 UART console
CONFIG_UART_LINE_CTRL=y                # CDC DTR；main.c wait_usb_console() 等主机打开串口
CONFIG_USE_SEGGER_RTT=n                # 关掉 RTT，日志不要跑到 J-Link

# --- USB CDC ACM：插 USB 当虚拟串口看 log ---
CONFIG_USB_DEVICE_STACK_NEXT=y         # 新 USB device 栈
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="RAK4631 USP"
# 等 USB 枚举完再刷 log，避免开机丢字。数字赋值不要写同行注释。
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y    # USB 栈自己的 log 关掉，枚举时不刷屏
CONFIG_USBD_LOG_LEVEL_OFF=y

# --- 日志与内存 ---
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n        # CDC 不是彩色终端
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096

# --- 存储 / 电源 / 随机数 ---
CONFIG_FLASH=y                         # LBM 把 Join 会话写 NVM
CONFIG_PM_DEVICE=y                     # 设备级电源管理（电台驱动会用）
CONFIG_TEST_RANDOM_GENERATOR=y         # 软件伪随机；Join DevNonce 等需要

# --- 关掉 Zephyr 自带 LoRa/LoRaWAN，避免和 USP 抢同一颗 SX1262 ---
CONFIG_LORA=n
CONFIG_LORAWAN=n

# --- USP + LoRa Basics Modem ---
CONFIG_LORA_BASICS_MODEM_DRIVERS=y     # SX1262 走 USP 驱动，不是树上 semtech,sx1262
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_NO_THREAD=y  # DIO IRQ 不经中间线程，时间戳更准
CONFIG_USP=y
CONFIG_USP_LORA_BASICS_MODEM=y         # 编进 LBM 协议栈（join / MAC / 区域）
CONFIG_USP_MAIN_THREAD=y               # USP 自己跑 RAC 线程；main 只 init 然后 k_sleep

# --- 线程优先级（负数 = 协作式，不抢占；数字越小优先级越高） ---
# USP(-4) > main(-2)：main 让出 CPU 后 USP 立刻跑，临界区简单
CONFIG_MAIN_THREAD_PRIORITY=-2
CONFIG_USP_MAIN_THREAD_PRIORITY=-4
