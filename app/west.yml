# 本文件是 west 清单（manifest）。west init / west update 只认根键 manifest:。
# 初始化：在工作区根 rzi/ 执行  west init -l app
#   -l = local，用本地这个 app/ 当老板仓，不去 GitHub 再 clone 一份清单仓。
# 不要给下面的 usp_zephyr 写 import: true，否则会并入它自带 west.yml 里锁死的 Zephyr v4.2.0。

# west 清单的唯一根键。self / remotes / projects 都必须缩进挂在它下面。
manifest:

  # 清单仓库自己（包含本 west.yml 的那个目录）。不是第三方，所以不进 projects，不会被 clone。
  self:
    # 老板仓相对工作区根的路径 → rzi/app。与 west init -l app、.west/config 里 path = app 一致。
    path: app

  # 远程 git 主机表。projects 里用 remote: 引用这里的 name，避免每个项目写完整 URL。
  remotes:
    # 列表第一项（- 表示一项）。名字 zephyrproject-rtos，下面 remote: zephyrproject-rtos 就是指它。
    - name: zephyrproject-rtos
      # URL 前缀。拼法：url-base + "/" + 项目 name → https://github.com/zephyrproject-rtos/zephyr
      url-base: https://github.com/zephyrproject-rtos
    # 第二个远程，给 Semtech 的 usp_zephyr 和 usp 用。
    - name: lora-net
      # LoRa-net 组织前缀。拼出 https://github.com/Lora-net/usp_zephyr 和 .../usp
      url-base: https://github.com/Lora-net

  # 要拉进工作区的第三方仓（不含 self）。west update 主要读这一块。
  projects:

    # 第一个项目。name 默认既是 GitHub 仓库名，也是本地目录名 → clone 到 rzi/zephyr/
    - name: zephyr
      # 用上面 remotes 里那个 zephyrproject-rtos → https://github.com/zephyrproject-rtos/zephyr
      remote: zephyrproject-rtos
      # 检出这一次 commit（当时的 Zephyr 4.4.99），不是浮动分支，也不是官方 USP 清单的 v4.2.0。
      revision: 161f758ba363ec90cd9b727a5d82e6c86efa85ad
      # 拉完后再读 zephyr/west.yml，把它列出的 HAL、mcuboot、tools 等并进本工作区。没有这行编 rak4631 会缺模块。
      import: true

    # 第二个项目。Semtech 的 Zephyr 封装（驱动、盾、sample、CMake）。clone 地址 = lora-net url-base + /usp_zephyr
    - name: usp_zephyr
      # → https://github.com/Lora-net/usp_zephyr
      remote: lora-net
      # 跟 main 分支最新提交。每次 west update 可能往前走；和上面 zephyr 钉 SHA 不同。
      revision: main
      # 放到工作区根下的 usp_zephyr/。这里 path 和 name 相同，不写也一样。
      # 注意：这一项没有 import: true，磁盘上的 usp_zephyr/west.yml west 不会读。
      # 本地改动用官方 west patch：app/zephyr/patches.yml，见 doc/west-patch.md。
      path: usp_zephyr

    # 第三个项目。协议栈本体（LBM + RAC），不是 usp_zephyr 那层封装。clone 地址 = https://github.com/Lora-net/usp
    - name: usp
      # 同样用 LoRa-net。
      remote: lora-net
      # 跟 usp 的 main，和 usp_zephyr 一样不锁死 SHA。
      revision: main
      # 本地必须放这里。这是 Zephyr/CMake 找 USP 模块的约定路径；放到别处构建系统找不到。
      path: modules/lib/usp
      # git clone / west update 时连该仓声明的 git submodule 一起拉（无线电驱动等）。不拉会缺源码。
      submodules: true
