# West manifest for RZI and the default USP LoRaWAN backend.
#
# Applications import this file with "import: true" on the rzi project.
# Projects defined in the application manifest take precedence over the ones
# imported from here; an application that lists zephyr itself keeps its own
# Zephyr revision, and this zephyr entry and its import are ignored. The
# import can be filtered with a name-blocklist when another backend replaces
# USP.
#
# This file is also a standalone workspace manifest:
#   west init -m https://github.com/DanielCao0/RZI rzi-ws  (or west init -l rzi)
#   west update
#
# The zephyr revision here is the one RZI is validated against. CI reads it
# from this file. Bump it together with zephyr/patches/.
#
# Do NOT add "import: true" to usp_zephyr: its own west.yml pins a different
# Zephyr release and would override the Zephyr revision selected here.

manifest:
  self:
    path: rzi

  projects:
    - name: zephyr
      url: https://github.com/zephyrproject-rtos/zephyr
      revision: fa4f8fb0e470210aee0ae6fb069a281bc6ac887a # v4.5.0-rc1
      import: true

    - name: usp_zephyr
      path: modules/usp_zephyr
      url: https://github.com/Lora-net/usp_zephyr
      revision: 64f416bddd5c95ec4504b00627aa932eb88c7bd5 # v1.2.1

    - name: usp
      url: https://github.com/Lora-net/usp
      revision: 540bba008477a8969e554b8d10dbf90ff6160c8e # v1.2.1
      path: modules/lib/usp
      submodules: true
