name: rzi
build:
  cmake: zephyr
  kconfig: zephyr/Kconfig
  settings:
    board_root: .
    dts_root: .
    snippet_root: .
samples:
  - samples
tests:
  - tests
boards:
  - .
# Copied into west spdx SBOMs so scanners can match CVEs against RZI.
# The version must match RZI_VERSION_STRING in include/rzi/version.h.
security:
  external-references:
    - cpe:2.3:a:rakwireless:rzi:0.2.0:*:*:*:*:*:*:*
    - pkg:github/DanielCao0/RZI@v0.2.0
