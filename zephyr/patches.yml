  - path: usp_zephyr/0004-sx1262-pa-compile-definitions.patch
    sha256sum: 271d33f77ac39d716bba057c8fe280c917d76fa0c5e43c73f4b9acee76959489
    module: usp_zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-09-05
    upstreamable: true
    apply-command: git apply
    comments: |
      Promote the SX1261/2/8 model macro to a global compile definition. It was
      previously visible only to the USP library, so the separate BSP library
      compiled sx126x_ral_bsp.c as SX1261 (device_sel=1, hp_max=0) and selected
      the 60 mA over-current limit.

  - path: usp_zephyr/0005-stm32wl-subghz-radio.patch
    sha256sum: 77dcc2af705baac4b55b7de935e5e45527a0a48a1ee5cfa8985fd6ec49e81fa6
    module: usp_zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-09-10
    upstreamable: true
    apply-command: git apply
    comments: |
      Enumerate st,stm32wl-subghz-radio in the USP SX126x driver (RAK3372
