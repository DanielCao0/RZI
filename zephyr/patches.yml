# Generated by scripts/generate-patch-manifest.py for use by west patch.
# Documentation: doc/west-patch.md
checkout-command: git checkout .
clean-command: git clean -f -- REUSE.toml

patches:
  - path: usp/0001-export-secure-element-session-keys.patch
    sha256sum: e36f6f69a855a12969801a8c19f19e13903c7503683a5d7a2c074a33fe78b27a
    module: usp
    author: rzi
    email: patches@rzi.local
    date: 2026-09-28
    upstreamable: true
    apply-command: git apply
    comments: |
      Export session keys from the software secure element so OTAA getters
      can read NwkSKey and AppSKey after join. The LR11xx crypto engine
      cannot export key material and returns an error.

  - path: usp/0002-ral-sx126x-frequency-limits.patch
    sha256sum: 91ea0d9d82b4a2447d5170948d307a233af23361c448fdac75e8ba28fb4fff54
    module: usp
    author: rzi
    email: patches@rzi.local
    date: 2026-10-11
    upstreamable: true
    apply-command: git apply
    comments: |
      Select the SX1261/SX1262 or SX1268 frequency limits with #if/#else.
      Upstream defines the SX1268 limits first and redefines them without
      #undef, which fails every SX1262 build under -Werror (twister).

  - path: usp/0003-user-channel-mask.patch
    sha256sum: 22f73b62339cda5294bdb920e5e97e44c3eabd85c2e2a7c577f32a0261a7f24e
    module: usp
    author: rzi
    email: patches@rzi.local
    date: 2026-10-11
    upstreamable: true
    apply-command: git apply
    comments: |
      Add smtc_modem_set/get_channel_mask() so the application can limit the
      US915 / AU915 / CN470 uplink channels before join (AT+MASK, AT+CHE,
      AT+CHS). The mask is ANDed into every default channel mask and the
      US915 / AU915 snapshots ignore disabled channels. LinkADRReq and the ADR
      back-off are unchanged.

  - path: usp/0004-reuse-license-annotations.patch
    sha256sum: 2ece2fe85f42c0826caed7c3e0bf0e905096e4e88a9819bc9acc347dea83e429
    module: usp
    author: rzi
    email: patches@rzi.local
    date: 2026-10-12
    upstreamable: true
    apply-command: git apply
    comments: |
      Add a REUSE.toml so west spdx attributes licenses and copyrights in the
      firmware SBOM. Semtech sources carry the Clear BSD text without SPDX
      tags; base64 is BSD-3-Clause, and the Gladman AES and Casado/Tsigas CMAC
      files get LicenseRef identifiers for the texts kept in LICENSES.txt.

  - path: usp_zephyr/0005-stm32wl-subghz-radio.patch
    sha256sum: 8dcaad970167a2a00daa0cbb05ea120b1d848a33705d1b8d778319010891ac75
    module: usp_zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-09-10
    upstreamable: true
    apply-command: git apply
    comments: |
      Enumerate st,stm32wl-subghz-radio in the USP SX126x driver (RAK3372
      on-chip SUBGHZ). Reset/busy use RCC/PWR, IRQ is EXTI 44, PA follows
      rfo-hp, and tx/rx-enable GPIOs track SetTx/SetRx.

  - path: usp_zephyr/0006-zephyr-4.5-warning-fixes.patch
    sha256sum: 4efddffabb89bec2f54c11ffeb7356baed8d5fff92ea4c75a10e597855276eba
    module: usp_zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-09-21
    upstreamable: true
    apply-command: git apply
    comments: |
      Update for Zephyr 4.5.0-rc1 APIs: include zephyr/sys/clock.h instead of
      the deprecated sys_clock.h wrapper, and replace SPI_OP_MODE_MASTER with
      SPI_OP_MODE_CONTROLLER in the USP radio board files.

  - path: usp_zephyr/0007-reuse-license-annotations.patch
    sha256sum: 62eb93d0a433a78e4a8c68bd399de5a4fdbcebc6bf9d6d48af7f59e43e8c26dd
    module: usp_zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-10-12
    upstreamable: true
    apply-command: git apply
    comments: |
      Add a REUSE.toml so west spdx attributes the Clear BSD license and
      Semtech copyright to sources and build files that carry no SPDX tags.
      Files with their own SPDX tags keep them.

  - path: usp_zephyr/0008-stm32wl-tcxo-reset-and-irq.patch
    sha256sum: 2efaabacfc9636810205b06626c1a1b18fe1b819a17c8d2828dd8b9e86493cea
    module: usp_zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-10-14
    upstreamable: true
    apply-command: git apply
    comments: |
      On RAK3372-F the radio IRQ line stays high until ClearIrqStatus, so the
      ISR masks NVIC and the HAL arms it again after that command. A radio
      reset also clears PB0-VDD_TCXO; park SYSCLK on HSI, program the
      regulator, then restore the HSE PLL when SYSCLK uses the TCXO.

  - path: zephyr/0009-stm32wl-locked-pm-resume.patch
    sha256sum: 22b3f283240da422119fcb8ccb2cd0f39f62f153073ec22a23086749eee19b92
    module: zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-10-15
    upstreamable: true
    apply-command: git apply
    comments: |
      Keep STM32WL wake interrupts pending until PM restores clocks and
      system-managed devices. Matches upstream
      https://github.com/zephyrproject-rtos/zephyr/pull/122293.
      Drop this patch once the pinned Zephyr revision contains it.

  - path: zephyr/0010-stm32-spi-resume-config.patch
    sha256sum: 544b6c60762a6cdc384ca8cc8444da64299f28bf0302167f4ff8ce8ea51b63a2
    module: zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-10-15
    upstreamable: true
    apply-command: git apply
    comments: |
      STOP may clear STM32 SPI CR1/CR2 while the driver still caches the
      spi_config pointer. Invalidate that cache on resume. Matches upstream
      https://github.com/zephyrproject-rtos/zephyr/pull/122292.
      Drop this patch once the pinned Zephyr revision contains it.

  - path: zephyr/0011-spi-nor-dpd-resume-delay.patch
    sha256sum: 23a65793bdcd05d75e6e1684e63c116eb94a3aa08a31c66ee393f0baa681a9fb
    module: zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-10-15
    upstreamable: true
    apply-command: git apply
    comments: |
      System-managed PM resume leaves SPI NOR deep power-down from the idle
      thread while wake interrupts are masked. Busy-wait when the caller
      cannot yield. Matches upstream
      https://github.com/zephyrproject-rtos/zephyr/pull/122312.
      Drop this patch once the pinned Zephyr revision contains it.
