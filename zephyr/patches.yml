  - path: usp_zephyr/0003-disable-duplicate-xiao-board-root.patch
    sha256sum: a55bb5040a3d288e10604151b9e5796e4f59ca81b00299ffb04f5fa09e295f80
    module: usp_zephyr
    author: rzi
